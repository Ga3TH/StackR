name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Tests
        run: dotnet test StackR.sln -c Release --filter "Category!=Integration"

      - name: Publication
        shell: pwsh
        run: ./build.ps1 -SkipTests

      - name: Installeur Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc "/DAppVersion=$env:VERSION" installer/StackR.iss
          if ($LASTEXITCODE -ne 0) { throw 'Compilation Inno Setup en échec' }
          Rename-Item publish/StackR-Setup.exe "StackR-Setup-$env:VERSION.exe"

      - name: Archive portable
        shell: pwsh
        run: Compress-Archive -Path publish/StackR/* -DestinationPath "publish/StackR-$env:VERSION-win-x64.zip"

      - name: Notes de version
        shell: pwsh
        run: |
          $text = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $m = [regex]::Match($text, "(?ms)^## \[$([regex]::Escape($env:VERSION))\][^\r\n]*\r?\n(.*?)(?=^## \[|\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "StackR $env:VERSION" }
          Set-Content release-notes.md $notes -Encoding utf8

      - name: Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            publish/StackR-Setup-${{ env.VERSION }}.exe
            publish/StackR-${{ env.VERSION }}-win-x64.zip
